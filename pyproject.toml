[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kizunapdf"
version = "0.1.0"
description = "Local Japanese-to-English PDF translation with editable XeLaTeX reconstruction"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1", "typer>=0.15,<1", "pymupdf>=1.26,<2",
  "pikepdf>=9.5,<11", "pypdfium2>=4.30,<6", "pillow>=11,<13",
  "numpy>=2.2,<3", "huggingface-hub>=0.30,<2", "psutil>=6,<8",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.29.1,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
kizunapdf = "kizunapdf.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires XeLaTeX", "real_model: opt-in local MLX inference"]
